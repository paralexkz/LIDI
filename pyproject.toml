[project]
name = "lidi"
version = "0.1.0"
description = "LIDI — web scraping workspace built on ScrapeGraphAI"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "scrapegraphai>=2.2.4",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "langchain-community>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lidi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
